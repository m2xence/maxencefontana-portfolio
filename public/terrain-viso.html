<script>
const canvas=document.querySelector('canvas');
const status=document.querySelector('small');
const section=document.querySelector('section');
const contours=document.querySelector('#contours');
const detail=document.querySelector('#detail');
const village=document.querySelector('#village');
const label=document.querySelector('#village-label');
const frame=document.querySelector('.frame');
const inspectButton=document.querySelector('#inspect');
const zoomControls=document.querySelector('.zoom-controls');
const help=document.querySelector('.inspect-help');
const zoomLevel=document.querySelector('#zoom-level');
let inspecting=false, magnification=1, panX=0, panY=0, orbit=0, heldAngle=.4, drag=null;

const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const gl=canvas.getContext('webgl2',{antialias:true});
const vertex=`#version 300 es
precision highp float;
precision highp int;
precision highp usampler2D;
uniform usampler2D terrain;
uniform int stride;
uniform int grid;
uniform ivec2 origin;
uniform ivec2 last;
uniform vec2 focus;
uniform float zoom;
uniform float angle;
uniform vec2 scale;
uniform vec2 pan;
out vec3 normal;
out float elevation;
out float water;
out vec2 edge;
out float depth;
uint sampleAt(ivec2 p){return texelFetch(terrain,clamp(p,ivec2(0),ivec2(599)),0).r;}
float altitude(ivec2 p){return float(sampleAt(p)&32767u)*.125;}
void main(){
  ivec2 p=min(ivec2(gl_VertexID%grid,gl_VertexID/grid)*stride+origin,last);
  elevation=altitude(p);
  water=float(sampleAt(p)>>15);
  float dx=altitude(p+ivec2(1,0))-altitude(p-ivec2(1,0));
  float dz=altitude(p+ivec2(0,1))-altitude(p-ivec2(0,1));
  normal=normalize(vec3(-dx,50.,-dz));
  vec2 flatPosition=(vec2(p)-focus)/599.;
  edge=flatPosition;
  float c=cos(angle),s=sin(angle);
  float x=c*flatPosition.x-s*flatPosition.y;
  float z=s*flatPosition.x+c*flatPosition.y;
  float y=(elevation-mix(2180.,2140.,zoom))/14995.;
  float pitch=mix(.63,.47,zoom);
  float ce=cos(pitch), se=sin(pitch);
  depth=ce*z+se*y;
  float perspective=1.-depth*.58;
  vec2 center=vec2(.08,-.24)+pan;
  vec2 position=center*perspective+scale*vec2(x,ce*y-se*z);
  gl_Position=vec4(position,-.65*depth,perspective);
}`;
const fragment=`#version 300 es
precision highp float;
uniform bool lines;
uniform float zoom;
in vec3 normal;
in float elevation;
in float water;
in vec2 edge;
in float depth;
out vec4 color;
float contour(float interval){
  float level=elevation/interval;
  float distanceToLine=abs(fract(level+.5)-.5);
  float footprint=fwidth(level);
  return (1.-smoothstep(.15*footprint,.95*footprint,distanceToLine))*(1.-smoothstep(.22,.65,footprint));
}
void main(){
  vec3 n=normalize(normal);
  float sun=max(0.,dot(n,normalize(vec3(-.6,.78,-.34))));
  float steepness=1.-n.y;
  vec3 grass=vec3(.30,.36,.28), rock=vec3(.59,.57,.52);
  vec3 material=mix(grass,rock,smoothstep(2300.,3300.,elevation+steepness*500.));
  vec3 lit=material*(.54+.68*sun);
  if(lines&&water<.5){
    float minor=contour(25.)*.27, major=contour(100.)*.57;
    lit=mix(lit,vec3(.95,.82,.56),max(minor,major));
  }
  lit=mix(lit,vec3(.12,.35,.39),smoothstep(.25,.75,water));
  lit=mix(lit,vec3(.30,.35,.34),clamp((-depth+.1)*.22,0.,.25));
  float rim=max(abs(edge.x),abs(edge.y));
  color=vec4(lit,1.-smoothstep(mix(.421,.105,zoom),mix(.499,.133,zoom),rim));
}`;
function compile(type,source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));
  return shader;
}
async function start(){
  if(!gl)throw Error('WebGL 2 indisponible');
  const compressed=Uint8Array.from(atob(document.querySelector('#raster').textContent.trim()),c=>c.charCodeAt(0));
  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const altitudes=new Uint16Array(await new Response(stream).arrayBuffer());
  if(altitudes.length!==600*600)throw Error('Données incomplètes');
  const program=gl.createProgram();
  gl.attachShader(program,compile(gl.VERTEX_SHADER,vertex));
  gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragment));
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const uniforms=Object.fromEntries(['terrain','stride','grid','origin','last','focus','zoom','angle','scale','pan','lines'].map(name=>[name,gl.getUniformLocation(program,name)]));
  const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.R16UI,600,600,0,gl.RED_INTEGER,gl.UNSIGNED_SHORT,altitudes);
  gl.uniform1i(uniforms.terrain,0);
  gl.enable(gl.DEPTH_TEST);gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,buffer);
  let count=0,gridKey='',queued=false;
  function setGrid(stride,mode){
    const key=stride+':'+mode;
    if(gridKey===key)return;
    gridKey=key;
    const bounds=mode===1?[1304,349,2103,1148]:mode===2?[455,1390,1254,2189]:[0,0,599,599];
    const [x0,y0,x1,y1]=bounds;
    const side=Math.ceil((x1-x0)/stride)+1;
    const indices=new Uint32Array((2*side+1)*(side-1));
    let index=0;
    for(let y=0;y<side-1;y++){
      for(let x=0;x<side;x++){
        indices[index++]=y*side+x;indices[index++]=(y+1)*side+x;
      }
      indices[index++]=0xffffffff;
    }
    count=indices.length;
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);
    gl.uniform1i(uniforms.grid,side);gl.uniform1i(uniforms.stride,stride);
    gl.uniform2i(uniforms.origin,x0,y0);gl.uniform2i(uniforms.last,x1,y1);
    gl.uniform2f(uniforms.focus,(x0+x1)/2,(y0+y1)/2);
  }
  function draw(){
    queued=false;
    const mode=village.getAttribute('aria-pressed')==='true'?2:detail.getAttribute('aria-pressed')==='true'?1:0;
    const full=mode!==0;
    setGrid(innerWidth<700?2:1,0);
    const span=Math.max(1,section.offsetHeight-canvas.clientHeight);
    const p=reduced.matches?0:Math.max(0,Math.min(1,-section.getBoundingClientRect().top/span));
    const aspect=canvas.width/canvas.height;
    const baseScale=full?Math.min(5.4,6.1*aspect):Math.min(1.72,1.52*aspect);
    const scale=baseScale*(inspecting?magnification:1);
    gl.uniform2f(uniforms.pan,inspecting?panX:0,inspecting?panY:0);
    gl.uniform1f(uniforms.zoom,full?1:0);
    gl.uniform2f(uniforms.scale,scale/aspect,scale);
    const scrollAngle=mode===2?-.45+.9*p:.40+1.95*p;
    if(!inspecting)heldAngle=scrollAngle;
    const angle=inspecting?heldAngle+orbit:scrollAngle;
    gl.uniform1f(uniforms.angle,angle);
    const fx=mode===2?854.5:1499.5,fy=mode===2?1789.5:1499.5;
    const x=(743-fx)/14995,z=(1715-fy)/14995;
    const pitch=full?.47:.63, y=(1605.625-(full?2140:2180))/14995;
    const planeX=Math.cos(angle)*x-Math.sin(angle)*z, planeZ=Math.sin(angle)*x+Math.cos(angle)*z;
    const perspective=1-(Math.cos(pitch)*planeZ+Math.sin(pitch)*y)*.58;
    const screenX=.08+(inspecting?panX:0)+(scale/aspect)*planeX/perspective;
    const screenY=-.24+(inspecting?panY:0)+scale*(Math.cos(pitch)*y-Math.sin(pitch)*planeZ)/perspective;
    label.hidden=mode===1||Math.abs(screenX)>.85||Math.abs(screenY)>.88;
    label.style.left=(screenX*.5+.5)*100+'%';
    label.style.top=(.5-screenY*.5)*100+'%';
    gl.uniform1i(uniforms.lines,contours.getAttribute('aria-pressed')==='true'?1:0);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.drawElements(gl.TRIANGLE_STRIP,count,gl.UNSIGNED_INT,0);
    if(gl.getError()!==gl.NO_ERROR){status.textContent='Le navigateur a rencontré une erreur de rendu.';return;}
    if(status.querySelector('a'))return;
    status.innerHTML='Courbes 25 m · LiDAR 5 m · <a href="https://www.geoportale.piemonte.it/geonetwork/auth/api/records/r_piemon:224de2ac-023e-441c-9ae0-ea493b217a8e">Regione Piemonte · CC BY 4.0</a> · <a href="https://registry.opendata.aws/copernicus-dem/">Copernicus GLO-30</a> · produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved';
  }
  function schedule(){if(!queued){queued=true;requestAnimationFrame(draw);}}
  function resize(){
    const ratio=Math.min(devicePixelRatio||1,inspecting?2.5:1.7);
    canvas.width=Math.round(canvas.clientWidth*ratio);canvas.height=Math.round(canvas.clientHeight*ratio);
    gl.viewport(0,0,canvas.width,canvas.height);schedule();
  }
  for(const button of [detail,village,contours])button.addEventListener('click',()=>{
    const active=button.getAttribute('aria-pressed')!=='true';
    if(button===detail)village.setAttribute('aria-pressed','false');
    if(button===village)detail.setAttribute('aria-pressed','false');
    button.setAttribute('aria-pressed',String(active));
    if(inspecting&&button!==contours){heldAngle=button===village&&active?-.45:.4;resetView();}
    schedule();
  });
  function resetView(){
    magnification=1;panX=0;panY=0;orbit=0;zoomLevel.value='1×';schedule();
  }
  function updateInspect(active){
    inspecting=active;frame.classList.toggle('inspect',active);
    inspectButton.setAttribute('aria-pressed',String(active));
    inspectButton.textContent=active?'Quitter le plein écran':'Plein écran';
    zoomControls.hidden=help.hidden=!active;
    document.body.style.overflow=active?'hidden':'';
    resetView();resize();
  }
  inspectButton.addEventListener('click',async()=>{
    if(inspecting){
      if(document.fullscreenElement===frame)await document.exitFullscreen();
      else updateInspect(false);
      return;
    }
    updateInspect(true);
    try{await frame.requestFullscreen?.();}catch{}
  });
  document.addEventListener('fullscreenchange',()=>{if(inspecting&&!document.fullscreenElement)updateInspect(false);});
  function zoomBy(factor,x=.08,y=-.24){
    const next=Math.min(12,Math.max(1,magnification*factor));
    const ratio=next/magnification;
    panX=x-.08-(x-.08-panX)*ratio;
    panY=y+.24-(y+.24-panY)*ratio;
    magnification=next;
    zoomLevel.value=next.toFixed(1).replace(/\.0$/,'')+'×';schedule();
  }
  canvas.addEventListener('wheel',event=>{
    if(!inspecting)return;
    event.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?canvas.clientHeight:1);
    zoomBy(Math.exp(-Math.max(-250,Math.min(250,delta))*.0025),
      2*(event.clientX-rect.left)/rect.width-1,1-2*(event.clientY-rect.top)/rect.height);
  },{passive:false});
  canvas.addEventListener('pointerdown',event=>{
    if(!inspecting||drag||event.button!==0)return;
    canvas.setPointerCapture(event.pointerId);
    drag={id:event.pointerId,x:event.clientX,y:event.clientY};
  });
  canvas.addEventListener('pointermove',event=>{
    if(drag?.id!==event.pointerId)return;
    panX+=2*(event.clientX-drag.x)/canvas.clientWidth;
    panY-=2*(event.clientY-drag.y)/canvas.clientHeight;
    drag.x=event.clientX;drag.y=event.clientY;schedule();
  });
  for(const type of ['pointerup','pointercancel','lostpointercapture']){
    canvas.addEventListener(type,event=>{if(drag?.id===event.pointerId)drag=null;});
  }
  document.querySelector('#zoom-in').onclick=()=>zoomBy(1.5);
  document.querySelector('#zoom-out').onclick=()=>zoomBy(1/1.5);
  document.querySelector('#turn-left').onclick=()=>{orbit-=Math.PI/12;schedule();};
  document.querySelector('#turn-right').onclick=()=>{orbit+=Math.PI/12;schedule();};
  document.querySelector('#reset-view').onclick=resetView;
  addEventListener('keydown',event=>{
    if(inspecting&&event.key==='Escape'&&!document.fullscreenElement)updateInspect(false);
  });
  addEventListener('scroll',schedule,{passive:true});addEventListener('resize',resize);reduced.addEventListener('change',schedule);
  resize();
}
start().catch(error=>{status.textContent='Relief indisponible dans ce navigateur. '+error.message;});
